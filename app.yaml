service: voice-clone
runtime: python312
instance_class: F4

automatic_scaling:
  min_instances: 0
  max_instances: 5

# Set secrets in GCP Console → App Engine → voice-clone → Variables:
#   GEMINI_API_KEY, ELEVENLABS_API_KEY, HF_TOKEN (optional)
# Heavy pyannote/torch does not fit standard GAE — use local diarization on deploy:
env_variables:
  DIARIZATION_BACKEND: "local"
  HF_HOME: "/tmp/hf"
  HF_HUB_CACHE: "/tmp/hf/hub"

entrypoint: gunicorn -b :$PORT -w 1 --timeout 120 -k uvicorn.workers.UvicornWorker main:app
# Readiness checks are Flex/Cloud Run only — Standard uses default routing to :$PORT.
# After deploy, verify: https://YOUR_HOST/health and /voice/status
